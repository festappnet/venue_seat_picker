name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: dart pub global activate fvm
      - run: fvm install 3.47.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 tool/configure_workspace.py
      - run: fvm flutter pub get
      - run: fvm flutter analyze
      - run: fvm flutter test
      - run: fvm dart pub get && fvm dart test
        working-directory: packages/venue_layout_core
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: tool/demo.sh build
      - run: tool/demo.sh check
      - run: tool/archive_check.sh
