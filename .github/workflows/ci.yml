name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: dart pub global activate fvm
      - run: fvm install 3.47.2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: node --test tool/npm_release.test.mjs
      - run: python3 tool/configure_workspace.py
      - run: fvm flutter pub get
      - run: fvm dart pub get
        working-directory: packages/venue_layout_core
      - run: fvm flutter analyze
      - run: fvm flutter test --concurrency=1
      - run: fvm dart pub get && fvm dart test
        working-directory: packages/venue_layout_core
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: tool/demo.sh build
      - run: tool/demo.sh check
      - run: tool/archive_check.sh
      - name: Retain verified npm distribution
        uses: actions/upload-artifact@v4
        with:
          name: verified-npm-${{ github.sha }}
          path: |
            build/qa/archive/archive-result.json
            build/qa/archive/npm-pack.json
            build/qa/archive/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish-npm:
    name: Publish verified npm distribution
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: verified-npm-${{ github.sha }}
          path: verified-npm
      - name: Check source identity and release version
        id: package
        run: node tool/npm_release.mjs verified-npm
      - name: Publish the tested archive using npm trusted publishing
        if: steps.package.outputs.publish == 'true'
        env:
          NPM_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: pnpm publish "$NPM_ARCHIVE" --access public --provenance --no-git-checks
